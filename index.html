const url=new URLSearchParams(location.search);
const ZEMIN_ALT=8; // stat sokak seviyesinin bu kadar altında
const AYAR={

const cv=document.getElementById('c');
const MOBIL=/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
const KALITE=url.get('kalite')||(MOBIL?'orta':'yuksek'); // dusuk: gölgesiz · orta: 2048 gölge · yuksek: 4096 gölge
let PR=Math.min(devicePixelRatio,KALITE==='dusuk'?1.25:2);

function gokKur(){const sky=new Sky(); sky.scale.setScalar(8000); const u=sky.material.uniforms;

{const c=document.createElement('canvas');c.width=4;c.height=512;const g=c.getContext('2d');const gr=g.createLinearGradient(0,0,0,512);

{const pm=new THREE.PMREMGenerator(renderer), gs=new THREE.Scene(); gs.add(gokKur()); scene.environment=pm.fromScene(gs,0,1,9000).texture; pm.dispose();}
scene.fog=new THREE.Fog(0xb9cfe5,1800,9000);
const cam=new THREE.PerspectiveCamera(45,1,0.5,9000); cam.position.set(170,130,190);
const ctl=new OrbitControls(cam,cv); ctl.target.set(0,8,0); ctl.enableDamping=true; ctl.maxPolarAngle=Math.PI*0.495; ctl.minDistance=5; ctl.maxDistance=2500;

const gunes=new THREE.DirectionalLight(0xfff1dc,3.2); gunes.position.copy(GUNES_YON).multiplyScalar(400); scene.add(gunes); scene.add(gunes.target);
{const sc=gunes.shadow.camera; sc.left=-175; sc.right=175; sc.top=175; sc.bottom=-175; sc.near=50; sc.far=900;
 const ms=KALITE==='yuksek'?4096:2048; gunes.shadow.mapSize.set(ms,ms); gunes.shadow.bias=-0.0004; gunes.shadow.normalBias=0.35; gunes.castShadow=renderer.shadowMap.enabled;}

/* ============ geometri ============ */
const A=AYAR.saha.boy/2+AYAR.kaleArasi, B=AYAR.saha.en/2+AYAR.tacArasi;
const R=Math.PI/180, sgn=v=>v<0?-1:1;
function ic(t){const c=Math.cos(t),s=Math.sin(t),e=2/AYAR.n;
  const x=A*sgn(c)*Math.pow(Math.abs(c),e), z=B*sgn(s)*Math.pow(Math.abs(s),e);
  let nx=sgn(x)*Math.pow(Math.abs(x/A),AYAR.n-1)/A, nz=sgn(z)*Math.pow(Math.abs(z/B),AYAR.n-1)/B; const l=Math.hypot(nx,nz)||1;
  return {x,z,nx:nx/l,nz:nz/l};}
const nokta=(t,d)=>{const p=ic(t);return [p.x+p.nx*d,p.z+p.nz*d];};
const derece=t=>((t/R)%360+360)%360;
function ustSatir(t){
  const S=AYAR.ustSatir,c=Math.cos(t),s=Math.sin(t);
  const kenar=Math.pow(Math.abs(s),2.2),kale=Math.pow(Math.abs(c),2.2);
  const tepe= kenar>kale ? (s>0?S.dogu:S.bati) : (c>0?S.kuzey:S.guney);
  const k=Math.min(1,Math.max(0,(Math.max(kenar,kale)-0.47)/0.53)), y=k*k*(3-2*k);
  return Math.round(S.kose+(tepe-S.kose)*y);}
const NS=4096,TT=[],LL=[0];
for(let i=0;i<=NS;i++) TT.push(i/NS*Math.PI*2);
{let p=ic(0);for(let i=1;i<=NS;i++){const q=ic(TT[i]);LL.push(LL[i-1]+Math.hypot(q.x-p.x,q.z-p.z));p=q;}}
const CEVRE=LL[NS];
const Lt=t=>{const f=(((t/(2*Math.PI))%1)+1)%1*NS, i=Math.floor(f); return LL[i]+(LL[Math.min(i+1,NS)]-LL[i])*(f-i);};
function tL(L){L=((L%CEVRE)+CEVRE)%CEVRE;let lo=0,hi=NS;while(hi-lo>1){const m=(lo+hi)>>1;if(LL[m]<L)lo=m;else hi=m;}return TT[lo]+(TT[hi]-TT[lo])*(L-LL[lo])/(LL[hi]-LL[lo]);}
const ALT=AYAR.altKat,UST=AYAR.ustKat,BT=AYAR.bant;
const altYuk=ALT.derinlik*Math.tan(ALT.egim*R), ustYuk=UST.derinlik*Math.tan(UST.egim*R);
const ALT_BAS=1.2, UST_D0=ALT.satir*ALT.derinlik+AYAR.koridor;
const BANT_Y0=ALT_BAS+ALT.satir*altYuk+0.3, BANT_H=BT.led*2+BT.loca*2+BT.doseme*3, UST_Y0=BANT_Y0+BANT_H+0.6;
const sira=(kat,r)=>kat===1?{d:r*ALT.derinlik,y:ALT_BAS+r*altYuk}:{d:UST_D0+r*UST.derinlik,y:UST_Y0+r*ustYuk};
const MAX_UST=Math.max(...Object.values(AYAR.ustSatir));
function dilim(t){let a=derece(t); if(a<235)a+=360; return AYAR.dilimler.find(d=>a>=d.t0&&a<d.t1)||AYAR.dilimler[0];}
function blokAdi(t,kat){const d=dilim(t); let a=derece(t); if(a<235)a+=360; const l=kat===1?d.alt:d.ust;
  const w=l.map(b=>b==='VIP'?1.6:b==='BASIN'?0.6:1), top=w.reduce((s,x)=>s+x,0);
  const L0=Lt(d.t0*R),L1=Lt(d.t1*R); let span=L1-L0; if(span<0)span+=CEVRE; let u=Lt(a*R)-L0; if(u<0)u+=CEVRE; u/=span;
  let acc=0; for(let i=0;i<l.length;i++){acc+=w[i]/top; if(u<acc) return l[i];} return l[l.length-1];}

/* ============ koltuklar ============ */
const koltuklar=[];
function hsh(a,b){let h=(a*374761393+b*668265263)>>>0; h=Math.imul(h^(h>>>13),1274126177)>>>0; return ((h^(h>>>16))>>>0)/4294967296;}
const blokSinir={1:[],2:[]}; // merdiven/giriş yerleri (t)
for(const kat of [1,2]){
  const maxR=kat===1?ALT.satir:MAX_UST;
  for(let r=0;r<maxR;r++){
    const {d,y}=sira(kat,r), n=Math.floor((CEVRE+2*Math.PI*d)/AYAR.koltukGen);
    let onceki=null, j=0;
    for(let i=0;i<n;i++){
      const t=tL((i+0.5)/n*CEVRE);
      if(kat===2&&r>=ustSatir(t)){onceki=null;continue;}
      const b=blokAdi(t,kat);
      if(b==='BASIN'){onceki=b;continue;}
      if(b!==onceki){ const ilk=onceki===null; onceki=b; j=0; if(r===(kat===1?22:7)&&!ilk) blokSinir[kat].push(t); if(!ilk) continue; }
      j++; if(j%AYAR.blokIciMerdiven===0) continue;
      const p=ic(t);
      koltuklar.push({x:p.x+p.nx*(d+0.4),y,z:p.z+p.nz*(d+0.4),ry:Math.atan2(-p.nx,-p.nz),kat,r,t,blok:b});
    }
  }
}
const hamSayi=koltuklar.length;
{ const fark=koltuklar.length-AYAR.hedefKoltuk;
  if(fark>0){const sil=new Set(koltuklar.map((k,i)=>({i,s:(k.kat===2?1000:0)+k.r*10+Math.abs(Math.sin(2*k.t))*5})).sort((a,b)=>b.s-a.s).slice(0,fark).map(a=>a.i));
    const kalan=koltuklar.filter((_,i)=>!sil.has(i)); koltuklar.length=0; koltuklar.push(...kalan);} }
{const g=new Map(), f=t=>{let x=derece(t);if(x<235)x+=360;return x;};
 koltuklar.forEach((k,i)=>{const key=k.blok+'|'+k.r; if(!g.has(key))g.set(key,[]); g.get(key).push(i);});
 for(const l of g.values()){ l.sort((a,b)=>f(koltuklar[a].t)-f(koltuklar[b].t)); l.forEach((idx,n)=>{koltuklar[idx].no=n+1; koltuklar[idx].sira=koltuklar[idx].r+1;}); }}

const yaziMaske=AYAR.yazilar.map(y=>{const c=document.createElement('canvas'); c.width=1200; c.height=150; const g=c.getContext('2d');
  g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.fillStyle='#000'; g.strokeStyle='#000'; g.textAlign='center'; g.textBaseline='middle';
  const solBos=y.logo?150:0; let fs=140; const f=()=>g.font=`${y.font} ${fs}px system-ui,Arial`; f();
  while(g.measureText(y.metin).width>(c.width-solBos)*0.97&&fs>20){fs-=4; f();}
  const tw=g.measureText(y.metin).width, x0=(c.width-tw-solBos)/2;
  if(y.logo){g.lineWidth=16; const cx=x0+60,cy=c.height/2,r=48; g.beginPath(); for(let k=0;k<6;k++){const a=k/6*Math.PI*2+Math.PI/6; k?g.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a)):g.moveTo(cx+r*Math.cos(a),cy+r*Math.sin(a));} g.closePath(); g.stroke();}

  const d=sira(k.kat,k.r).d, olcek=(CEVRE+2*Math.PI*d)/CEVRE, x=hsh(i,k.r+k.kat*100);
  for(const y of yaziMaske){ if(y.kat!==k.kat||k.r<y.r0||k.r>y.r1) continue;
    let s=(Lt(k.t)-Lt(y.t*R)); if(s>CEVRE/2)s-=CEVRE; if(s<-CEVRE/2)s+=CEVRE; s*=olcek;
    if(Math.abs(s)>y.gen/2) continue;
    const px=Math.floor((s/y.gen+0.5)*(y.W-1)), py=Math.floor((1-(k.r-y.r0+0.5)/(y.r1-y.r0+1))*(y.H-1));
    if(y.veri[(py*y.W+px)*4]<128) return y.renk==='siyah'?AYAR.renk.siyah:AYAR.renk.beyaz; }
  if(k.kat===2) return x<0.18?AYAR.renk.ustGri:AYAR.renk.ustSiyah;
  if(dilim(k.t).kose) return x<0.12?AYAR.renk.ustGri:AYAR.renk.ustSiyah;   // alt kat köşeleri siyah

const koltukGeo=(()=>{const a=new THREE.BoxGeometry(0.44,0.08,0.40);a.translate(0,0.42,0);const b=new THREE.BoxGeometry(0.44,0.42,0.07);b.translate(0,0.63,0.19);return mergeGeometries([a,b]);})();
const KM=new THREE.InstancedMesh(koltukGeo,new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.45,metalness:0}),koltuklar.length);
const asilRenk=new Uint32Array(koltuklar.length);
{const m=new THREE.Matrix4(),q=new THREE.Quaternion(),e=new THREE.Euler(),s=new THREE.Vector3(1,1,1),c=new THREE.Color(),v=new THREE.Vector3();

scene.add(KM);

/* ============ basamaklar ============ */
function basamak(kat,renk){
  const pos=[],idx=[],M=720,maxR=kat===1?ALT.satir:MAX_UST,K=maxR*2+2;
  for(let i=0;i<=M;i++){const t=i/M*Math.PI*2,p=ic(t),nr=kat===1?ALT.satir:ustSatir(t),yer=[];
    for(let r=0;r<=maxR;r++){const rr=Math.min(r,nr),s=sira(kat,rr),s2=sira(kat,Math.max(0,rr-1)); yer.push([s.d,r===0?s.y-1.2:s2.y]); yer.push([s.d,s.y]);}
    const son=sira(kat,nr); yer.push([son.d+0.9,son.y]); while(yer.length<K) yer.push(yer[yer.length-1]);
    for(const [d,y] of yer.slice(0,K)) pos.push(p.x+p.nx*d,y,p.z+p.nz*d);}
  for(let i=0;i<M;i++)for(let j=0;j<K-1;j++){const a=i*K+j,b=(i+1)*K+j;idx.push(a,b,a+1,b,b+1,a+1);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();
  return new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:renk,side:THREE.DoubleSide}));}
scene.add(basamak(1,AYAR.renk.altMerdiven)); scene.add(basamak(2,AYAR.renk.ustMerdiven));

/* ============ halka şerit (isteğe bağlı doku, yay uzunluğuna göre uv) ============ */
function serit(d,y0,y1,mat,ac0=0,ac1=360,tekrar=8){const M=540,pos=[],uv=[],idx=[];let L=0,onc=null;
  for(let i=0;i<=M;i++){const a=ac0+(ac1-ac0)*i/M,[x,z]=nokta(a*R,d); if(onc)L+=Math.hypot(x-onc[0],z-onc[1]); onc=[x,z];
    pos.push(x,y0,z,x,y1,z); uv.push(L/tekrar,0,L/tekrar,1);}
  for(let i=0;i<M;i++){const a=i*2;idx.push(a,a+2,a+1,a+2,a+3,a+1);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();
  return new THREE.Mesh(g,mat);}
function dokuYap(w,h,ciz,tekrar=true){const c=document.createElement('canvas');c.width=w;c.height=h;ciz(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);if(tekrar)t.wrapS=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;}
// katlar arası bant: LED · loca (balkon koltukları) · döşeme · loca · LED   (8 m'de bir tekrar)
const bantDoku=dokuYap(512,512,(g,w,h)=>{
